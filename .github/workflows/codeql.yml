name: "CodeQL"

on:
  push:
    # salcedo-mod is this edition's default branch; master is kept for
    # parity with the upstream project.
    branches: [ "master", "salcedo-mod" ]
  # NOTE: No `branches:` filter on pull_request — CI runs on all pull requests.
  pull_request:
  schedule:
    - cron: '30 1 * * 0' # Run every Sunday at 1:30 AM

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: python

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
